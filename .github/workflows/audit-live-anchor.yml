name: Audit live-chain anchor
on:
  push:
    paths:
      - 'scripts/audit/*.py'
      - 'scripts/audit/*.json'
      - 'scripts/audit/*.mjs'
      - '.github/workflows/audit-live-anchor.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      RUN_FORK: ${{ contains(github.event.head_commit.message, 'run-fork') || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/9267cd86-acala
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install SCALE/metadata tooling
        run: python3 -m pip install --quiet substrate-interface==1.8.1
      - name: Probe Acala state
        run: python3 scripts/audit/live_state_probe.py --chain acala --mode state --out audit-live/acala-state.json --dump-evm-mismatches audit-live/evm-mismatch-acala
      - name: Probe Karura state
        run: python3 scripts/audit/live_state_probe.py --chain karura --mode state --out audit-live/karura-state.json
      - name: Read live paused-call filter
        run: |
          python3 scripts/audit/query_paused.py acala audit-live/paused-calls-acala.json
          python3 scripts/audit/query_paused.py karura audit-live/paused-calls-karura.json
      - name: Enumerate deployed EVM accounts, balances and bytecode
        continue-on-error: true
        env:
          EVM_MAX_ACCOUNTS: '400'
        run: |
          python3 scripts/audit/evm_inventory.py acala audit-live/evm-inventory-acala.json audit-live/evm-code-acala
          python3 scripts/audit/evm_inventory.py karura audit-live/evm-inventory-karura.json audit-live/evm-code-karura
      - name: Install chopsticks fork tooling
        if: env.RUN_FORK == 'true'
        run: npm install --no-audit --no-fund --silent @acala-network/chopsticks@1.5.2 @acala-network/chopsticks-core@1.5.2 @polkadot/api@latest
      - name: Fork mainnet and measure PnL of accumulated call sequences
        if: env.RUN_FORK == 'true'
        continue-on-error: true
        run: |
          ANCHOR_HASH=$(python3 -c 'import json;print(json.load(open("audit-live/acala-state.json"))["anchor"]["finalized_hash"])')
          export ANCHOR_HASH
          export OUT=audit-live/fork-fuzz.json
          timeout 600 node scripts/audit/fork_fuzz.mjs 2>&1 | tee audit-live/fork-fuzz.log
      - name: Publish evidence to branch
        run: |
          git config user.name "audit-bot"
          git config user.email "audit-bot@users.noreply.github.com"
          git add audit-live/
          git commit -m "audit: live chain anchor $(date -u +%Y-%m-%dT%H:%M:%SZ)" || echo "no changes"
          git push origin HEAD:arena/9267cd86-acala
