name: Audit live-chain anchor
on:
  push:
    paths:
      - 'scripts/audit/*.py'
      - 'scripts/audit/*.json'
      - '.github/workflows/audit-live-anchor.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/9267cd86-acala
      - name: Install SCALE/metadata tooling
        run: python3 -m pip install --quiet substrate-interface==1.8.1
      - name: Probe Acala state
        run: python3 scripts/audit/live_state_probe.py --chain acala --mode state --out audit-live/acala-state.json
      - name: Probe Karura state
        run: python3 scripts/audit/live_state_probe.py --chain karura --mode state --out audit-live/karura-state.json
      - name: Publish evidence to branch
        run: |
          git config user.name "audit-bot"
          git config user.email "audit-bot@users.noreply.github.com"
          git add audit-live/
          git commit -m "audit: live chain anchor $(date -u +%Y-%m-%dT%H:%M:%SZ)" || echo "no changes"
          git push origin HEAD:arena/9267cd86-acala
